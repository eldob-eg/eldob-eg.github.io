<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Lapland ❄️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:24px;overflow:hidden;color:#eef4ff;text-align:center;
  background:radial-gradient(130% 75% at 50% 0%,#11245a 0%,#081232 45%,#040817 100%) fixed;font-family:"Aref Ruqaa",serif}
.moon{position:fixed;top:7vh;left:8vw;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fffdf0,#f2ecd0 55%,#d9d0ad);box-shadow:0 0 40px 10px rgba(255,250,220,.25)}
.snow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/60px 60px,radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px) 30px 20px/45px 45px;
  animation:fall 12s linear infinite;opacity:.55}
@keyframes fall{to{background-position:20px 600px,50px 470px}}
h1{position:relative;font-size:clamp(40px,11vw,78px);line-height:1.5;
  background:linear-gradient(100deg,#5effc4,#7fd8ff 35%,#c59bff 65%,#ffe3a3);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(94,255,196,.35))}
@media (prefers-reduced-motion:reduce){.snow{animation:none}}
</style>
</head>
<body>
<div class="moon"></div>
<div class="snow"></div>
<h1>علشان خاطر عيون اشرررروف</h1>
</body>
</html>
